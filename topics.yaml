# Ключевые слова для назначения темы новости у источников с несколькими темами.
# Совпадение — без учёта регистра, слово начинается с ключа (ключ "агент" найдёт
# "агента", "агентов"). Сначала ищем в заголовке, затем в тексте новости; темы
# перебираются в том порядке, в каком они указаны у источника в sources.yaml.
# Если ничего не найдено, берётся первая тема источника.
# Порядок тем в этом файле = порядок разделов в дайджесте.
# Тема с пустым списком ([]) никогда не совпадает и получает новость только как
# запасная (когда не нашлось совпадений), поэтому её ставят первой у источника.
