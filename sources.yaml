# Источники для сбора новостей (MVP).
# Список составлен на основе sources_mvp.md (11 источников, 5 тем).
# Плоский список — каждый источник указан один раз, темы перечислены
# в поле topics. Habr — исключение: указан двумя отдельными записями
# (лента AI и лента Программирование), т.к. у хабов разные RSS-адреса.
# Поле enabled управляет тем, забирается ли источник в MVP:
# AI Drip (архив рассылки, type: scrape) и Product Hunt (GraphQL API,
# type: api) отключены — способ сбора для них ещё предстоит реализовать.

